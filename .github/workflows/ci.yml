name: NevUp CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nevup
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: nevup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nevup"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Run migrations
        run: npx tsx src/db/migrate.ts
        env:
          DATABASE_URL: postgresql://nevup:secret@localhost:5432/nevup
          REDIS_URL: redis://localhost:6379

      - name: Seed database
        run: npx tsx src/db/seed.ts
        env:
          DATABASE_URL: postgresql://nevup:secret@localhost:5432/nevup
          REDIS_URL: redis://localhost:6379

      - name: Build production
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nevup-backend .

      - name: Verify Docker Compose
        run: docker compose config
