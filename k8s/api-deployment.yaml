apiVersion: apps/v1
kind: Deployment
metadata:
  name: nevup-api
  labels:
    app: nevup-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nevup-api
  template:
    metadata:
      labels:
        app: nevup-api
    spec:
      containers:
        - name: api
          image: nevup-backend:latest
          ports:
            - containerPort: 4010
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nevup-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: nevup-config
                  key: redis-url
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: nevup-config
                  key: kafka-broker
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nevup-secrets
                  key: jwt-secret
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4010"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 4010
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4010
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nevup-api-service
spec:
  selector:
    app: nevup-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4010
  type: LoadBalancer
