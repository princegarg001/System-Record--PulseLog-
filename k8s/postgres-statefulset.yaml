apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nevup-postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: nevup-postgres
  template:
    metadata:
      labels:
        app: nevup-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "nevup"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nevup-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: "nevup"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: nevup-postgres
  ports:
    - port: 5432
  clusterIP: None
